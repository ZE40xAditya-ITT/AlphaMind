services:
  - type: web
    name: alphamind-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alphamind-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PYTHONPATH
        value: "."
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: RATE_PER_SEARCH
        value: "20.0"

  - type: cron
    name: alphamind-digest-scheduler
    runtime: python
    schedule: "0 2 * * 0"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.services.digest_scheduler
    envVars:
      - fromGroup: alphamind-env

databases:
  - name: alphamind-db
    plan: free
